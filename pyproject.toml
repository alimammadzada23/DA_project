[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insightpilot"
version = "0.1.0"
description = "Evidence-led multi-dataset business intelligence"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "defusedxml>=0.7,<1",
    "pandas>=2.2,<4",
    "streamlit>=1.45,<2",
    "pm4py>=2.7,<3",
    "httpx>=0.28,<1",
    "plotly>=6,<7",
    "openpyxl>=3.1,<4",
    "pyarrow>=18,<24",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "streamlit-ace>=0.1.1,<0.2",
    "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5"]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
browser = [
    "playwright>=1.50,<2",
]

[project.scripts]
insightpilot = "insightpilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
insightpilot = ["*.sql"]
"insightpilot.universal" = ["command_hub/*.html"]
