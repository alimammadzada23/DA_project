<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:normal;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e6eff7}*{box-sizing:border-box}body{margin:0;background:transparent}.wheel-shell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px}svg{display:block;width:100%;max-width:360px;overflow:visible}.sector path{fill:#101f30;stroke:#294252;stroke-width:1;transition:fill .16s,stroke .16s}.sector.support path{fill:#101a2a;stroke:#31394e}.sector{cursor:pointer;outline:none}.sector:hover path,.sector:focus-visible path{fill:#163c49;stroke:#74e9df;stroke-width:2}.sector[aria-pressed=true] path{fill:#16434b;stroke:#60e5d5;stroke-width:2}.sector text{fill:#c4d4df;pointer-events:none;font-size:10.5px;font-weight:550;text-anchor:middle}.sector .symbol{font-size:19px;fill:#71d7cc}.sector.support .symbol{fill:#a5b6df}.sector[aria-pressed=true] text{fill:#9ff9e8}.hub-title{fill:#f0f7ff;font-size:16px;font-weight:650;text-anchor:middle}.hub-label{fill:#72d9cb;font-size:8px;letter-spacing:2px;text-anchor:middle}.destination{margin:0;min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center;color:#c2d8e5;font-size:12px;line-height:1.35;max-width:100%;overflow-wrap:anywhere}.toggle{display:block;border:1px solid #345462;border-radius:8px;background:#122736;color:#b8eee3;padding:8px 12px;font:500 12px/1.3 Inter,system-ui,sans-serif;cursor:pointer;min-height:36px;transition:background .16s,border-color .16s}.toggle:hover{background:#1b4149;border-color:#74e9df}.toggle:focus-visible{outline:2px solid #9ff9e8;outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.compact svg{max-width:216px}.compact .sector text:not(.symbol){display:none}.compact .sector .symbol{font-size:32px;transform:translateY(12px)}.compact .hub-title{font-size:20px}.compact .hub-label{font-size:10px;letter-spacing:1px}.home .toggle{display:none}.mobile:not(.expanded) .wheel-shell{flex-direction:row;gap:12px;padding:5px 12px;height:72px;justify-content:space-between}.mobile:not(.expanded) svg{width:60px;flex:0 0 60px;pointer-events:none}.mobile:not(.expanded) .destination{flex:1;text-align:left;justify-content:flex-start;font-size:12px}.mobile:not(.expanded) .toggle{display:block;flex:0 0 auto}.mobile.expanded .wheel-shell{gap:5px}.mobile.expanded svg{max-width:350px}.mobile.expanded .toggle{display:block}.mobile.expanded .destination{min-height:24px}.home:not(.mobile) .destination{display:none}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wheel-shell">
<p id="keyboard-help" class="sr-only">Ten destinations. Use arrow keys, Home or End to move focus. Press Enter or Space to navigate. Expand the wheel to read every destination label.</p>
<svg viewBox="0 0 400 400" role="group" aria-label="Ten-destination analytical command wheel" aria-describedby="keyboard-help"><defs><radialGradient id="core"><stop stop-color="#193642"/><stop offset="1" stop-color="#0c1b2a"/></radialGradient></defs><circle cx="200" cy="200" r="194" fill="none" stroke="#223746" stroke-dasharray="2 8"/><g id="sectors"></g><circle cx="200" cy="200" r="72" fill="url(#core)" stroke="#335a62"/><circle cx="200" cy="200" r="64" fill="none" stroke="#29454f"/>
<path d="M187 177l13-19 13 19-13 13z" fill="none" stroke="#6ce5d2" stroke-width="2"/><path d="M200 158v32m-13-13h26" stroke="#6ce5d2" stroke-width="1"/>
<text x="200" y="215" class="hub-title">InsightPilot</text><text x="200" y="233" class="hub-label">COMMAND HUB</text></svg>
<p id="destination" class="destination" aria-live="polite"></p>
<button id="toggle" class="toggle" type="button" aria-expanded="false">Expand wheel</button>
</div>
<script>
const pages=['Workspace Home','Data Hub','Quality & Preparation','Explore','Investigate','Reports','Overview','AI Analyst','SQL Lab','Advanced'];
const labels=[['Workspace','Home'],['Data Hub'],['Quality &','Preparation'],['Explore'],['Investigate'],['Reports'],['Overview'],['AI Analyst'],['SQL Lab'],['Advanced']];
const icons=['⌂','▤','◇','⌁','⌕','▧','▥','✧','⌘','⚙'];
const NS='http://www.w3.org/2000/svg';let active='Workspace Home',presentation='home',expanded=false,sequence=0,mobile=false,focusIndex=0;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function point(r,a){const t=a*Math.PI/180;return [200+r*Math.cos(t),200+r*Math.sin(t)]}
function el(name,attrs){const e=document.createElementNS(NS,name);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function event(value){send('streamlit:setComponentValue',{value:{...value,sequence:Date.now()+sequence++},dataType:'json'})}
function choose(page){event({page})}
function describe(page){document.getElementById('destination').textContent=page}
function layout(){
  // The component is served on the app origin. Read viewport width only; never
  // change the parent DOM. If embedded cross-origin, use the iframe width.
  let width=window.innerWidth;try{width=window.parent.innerWidth}catch(e){}
  mobile=width<=1100;
  const compact=!mobile&&presentation==='dock'&&!expanded;
  document.body.className=[presentation,mobile?'mobile':'',expanded?'expanded':'',compact?'compact':''].join(' ');
  const toggle=document.getElementById('toggle');toggle.textContent=expanded?'Collapse wheel':mobile?'Open wheel':'Expand wheel';
  toggle.setAttribute('aria-label',expanded?'Collapse command wheel':mobile?'Open command wheel':'Expand command wheel');
  toggle.setAttribute('aria-expanded',String(expanded));
  document.querySelector('svg').setAttribute('aria-hidden',String(mobile&&!expanded));
  document.querySelectorAll('.sector').forEach((s,i)=>s.setAttribute('tabindex',mobile&&!expanded?'-1':i===focusIndex?'0':'-1'));
  requestAnimationFrame(()=>send('streamlit:setFrameHeight',{height:Math.ceil(document.querySelector('.wheel-shell').getBoundingClientRect().height+4)}));
}
pages.forEach((page,i)=>{const start=-108+i*36+1,end=start+34,mid=(start+end)/2;const a=point(186,start),b=point(186,end),c=point(80,end),d=point(80,start);const group=el('g',{class:'sector'+(i>=6?' support':''),role:'button',tabindex:i===0?'0':'-1','aria-label':page,'aria-pressed':'false','data-page':page});const tooltip=el('title',{});tooltip.textContent=page+' — Enter or Space to open';group.append(tooltip);group.append(el('path',{d:`M${a} A186 186 0 0 1 ${b} L${c} A80 80 0 0 0 ${d} Z`}));const p=point(133,mid);const icon=el('text',{x:p[0],y:p[1]-12,class:'symbol','aria-hidden':'true'});icon.textContent=icons[i];group.append(icon);labels[i].forEach((line,j)=>{const text=el('text',{x:p[0],y:p[1]+6+j*13,'aria-hidden':'true'});text.textContent=line;group.append(text)});group.addEventListener('click',()=>choose(page));group.addEventListener('mouseenter',()=>describe(page));group.addEventListener('mouseleave',()=>describe(active));group.addEventListener('focus',()=>describe(page));group.addEventListener('blur',()=>describe(active));group.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();focusIndex=e.key==='Home'?0:e.key==='End'?9:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:9))%10;document.querySelectorAll('.sector').forEach((s,j)=>s.setAttribute('tabindex',j===focusIndex?'0':'-1'));document.querySelectorAll('.sector')[focusIndex].focus()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(page)}});document.getElementById('sectors').append(group)});
document.getElementById('toggle').addEventListener('click',()=>event({action:'toggle'}));
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;active=e.data.args.active;presentation=e.data.args.presentation||'home';expanded=Boolean(e.data.args.expanded);focusIndex=Math.max(0,pages.indexOf(active));document.querySelectorAll('.sector').forEach(s=>s.setAttribute('aria-pressed',String(s.dataset.page===active)));describe(active);layout()});
window.addEventListener('resize',layout);
new ResizeObserver(layout).observe(document.documentElement);
send('streamlit:componentReady',{apiVersion:1});layout();
</script></body></html>
